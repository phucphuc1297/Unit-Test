name: CI — .NET

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test with coverage
        run: dotnet test --no-build --configuration Release --results-directory ./TestResults --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
      - name: Install reportgenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.1.23 || true

      - name: Convert coverage to HTML
        env:
            PATH: ${{ env.PATH }}:$HOME/.dotnet/tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path coverage-report | Out-Null

          $coverageFile = Get-ChildItem -Path ./TestResults -Recurse -Filter "coverage.cobertura.xml" |
                          Select-Object -First 1 -ExpandProperty FullName

          if (-not $coverageFile) {
            Write-Error "coverage.cobertura.xml not found under ./TestResults"
          }

          # Ensure reportgenerator is on PATH (global tool location on Windows runner)
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"

          reportgenerator "-reports:$coverageFile" "-targetdir:coverage-report" "-reporttypes:Html"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report